name: CI

on:
  pull_request:
  push:
    branches: [dev]
  # Sur main, deploiement.yml l'appelle avant de publier l'image
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: dashility
          POSTGRES_PASSWORD: dashility
          POSTGRES_DB: dashility
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx -w @dashility/dashboard playwright install --with-deps chromium
      - run: npm run test:e2e -w @dashility/dashboard
